apiVersion: apps/v1
kind: Deployment
metadata:
  name: junsong-gateway
  namespace: junsong
spec:
  replicas: 2
  selector:
    matchLabels:
      app: junsong-gateway
  template:
    metadata:
      labels:
        app: junsong-gateway
    spec:
      containers:
        - name: gateway
          image: junsong-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: junsong-config
            - secretRef:
                name: junsong-secrets
          env:
            - name: NACOS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: junsong-secrets
                  key: NACOS_PASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: junsong-gateway
  namespace: junsong
spec:
  selector:
    app: junsong-gateway
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: junsong-auth
  namespace: junsong
spec:
  replicas: 2
  selector:
    matchLabels:
      app: junsong-auth
  template:
    metadata:
      labels:
        app: junsong-auth
    spec:
      containers:
        - name: auth
          image: junsong-auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9200
          envFrom:
            - configMapRef:
                name: junsong-config
            - secretRef:
                name: junsong-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9200
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: junsong-auth
  namespace: junsong
spec:
  selector:
    app: junsong-auth
  ports:
    - port: 9200
      targetPort: 9200
