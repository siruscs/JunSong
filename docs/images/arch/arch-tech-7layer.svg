  <text x="600" y="377" text-anchor="middle" class="card-sub">熔断降级 · 流控</text>
  <text x="600" y="397" text-anchor="middle" class="card-sub">热点参数防护</text>

  <rect x="780" y="325" width="260" height="90" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
