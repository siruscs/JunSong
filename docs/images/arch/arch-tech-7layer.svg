  <text x="710" y="1177" text-anchor="middle" class="card-sub">文件 · 图片 · 附件</text>

  <rect x="850" y="1105" width="220" height="90" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
