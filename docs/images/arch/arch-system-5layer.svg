  <text x="310" y="883" class="layer-desc" fill="#ccfbf1">容器化 · 编排 · 可观测 · DevOps</text>

  <rect x="100" y="910" width="180" height="95" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="190" y="940" text-anchor="middle" class="card-title">Docker</text>
  <text x="190" y="962" text-anchor="middle" class="card-sub">容器化打包</text>
  <text x="190" y="982" text-anchor="middle" class="card-sub">镜像管理</text>

  <rect x="310" y="910" width="180" height="95" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="400" y="940" text-anchor="middle" class="card-title">Kubernetes</text>
  <text x="400" y="962" text-anchor="middle" class="card-sub">Pod · Service · Ingress</text>
  <text x="400" y="982" text-anchor="middle" class="card-sub">弹性伸缩</text>

  <rect x="520" y="910" width="180" height="95" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="610" y="940" text-anchor="middle" class="card-title">Grafana + Prometheus</text>
  <text x="610" y="962" text-anchor="middle" class="card-sub">指标监控 · 告警</text>
  <text x="610" y="982" text-anchor="middle" class="card-sub">可视化仪表盘</text>

  <rect x="730" y="910" width="180" height="95" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="820" y="940" text-anchor="middle" class="card-title">SkyWalking + ELK</text>
  <text x="820" y="962" text-anchor="middle" class="card-sub">链路追踪 · 日志分析</text>
  <text x="820" y="982" text-anchor="middle" class="card-sub">全栈可观测</text>

  <!-- ============ Legend ============ -->
  <rect x="60" y="1060" width="1080" height="80" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="90" y="1084" class="legend-text" font-weight="600">图例 / Legend</text>

  <rect x="90" y="1100" width="80" height="18" rx="3" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
  <text x="178" y="1114" class="legend-text">用户接入层</text>

  <rect x="310" y="1100" width="80" height="18" rx="3" fill="#eff6ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="398" y="1114" class="legend-text">接入网关层</text>

  <rect x="530" y="1100" width="80" height="18" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="618" y="1114" class="legend-text">业务服务层</text>

  <rect x="750" y="1100" width="80" height="18" rx="3" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="838" y="1114" class="legend-text">数据资源层</text>

  <rect x="970" y="1100" width="80" height="18" rx="3" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="1058" y="1114" class="legend-text">基础设施层</text>
</svg>