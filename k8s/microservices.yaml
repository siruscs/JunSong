apiVersion: apps/v1
kind: Deployment
metadata:
  name: junsong-modules-system
  namespace: junsong
spec:
  replicas: 2
  selector:
    matchLabels:
      app: junsong-modules-system
  template:
    metadata:
      labels:
        app: junsong-modules-system
    spec:
      containers:
        - name: system
          image: junsong-modules-system:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9201
          envFrom:
            - configMapRef:
                name: junsong-config
            - secretRef:
                name: junsong-secrets
          resources:
            requests: { memory: "256Mi", cpu: "200m" }
            limits:   { memory: "512Mi", cpu: "500m" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 9201 }
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: junsong-modules-system
  namespace: junsong
spec:
  selector:
    app: junsong-modules-system
  ports:
    - port: 9201
      targetPort: 9201
---
