  <rect x="60" y="102" width="1080" height="12" fill="#ec4899"/>
  <text x="90" y="100" class="layer-title">① 用户接入层</text>
  <text x="310" y="100" class="layer-desc" fill="#fce7f3">多端统一接入，覆盖PC Web与移动端小程序</text>

  <!-- Cards in Layer 1 -->
  <rect x="130" y="130" width="220" height="90" rx="10" fill="#ffffff" stroke="#fbcfe8" stroke-width="1.5"/>
