<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1520" width="1200" height="1520">
  <defs>
    <style>
      .title { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 22px; font-weight: 700; fill: #1e293b; }
      .layer-title { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; font-weight: 700; fill: #ffffff; }
      .layer-desc { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12px; fill: #475569; }
      .card-title { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; font-weight: 600; fill: #1e293b; }
      .card-sub { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 11px; fill: #64748b; }
      .card-star { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 16px; fill: #f59e0b; }
    </style>
    <marker id="arrowDown" markerWidth="10" markerHeight="10" refX="5" refY="2" orient="auto">
      <path d="M0,0 L5,8 L10,0 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1520" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" class="title">军颂云 · 七层技术架构图</text>

  <!-- ==================== Layer 1: 用户接入层 (pink) ==================== -->
  <rect x="60" y="70" width="1080" height="170" rx="12" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
