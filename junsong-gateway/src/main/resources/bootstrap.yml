spring:
  application:
    name: junsong-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    redis:
      host: junsong-redis
      port: 6379
      password:
  cloud:
    nacos:
      config:
        server-addr: junsong-nacos:8848
        username: nacos
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yml
    gateway:
      server:
        webflux:
          discovery:
            locator:
              lowerCaseServiceId: true
              enabled: true
          routes:
            - id: junsong-auth
              uri: lb://junsong-auth
              predicates:
                - Path=/auth/**
              filters:
                - name: CacheRequestBody
                  args:
                    bodyClass: java.lang.String
                - ValidateCodeFilter
                - StripPrefix=1
            - id: junsong-gen
              uri: lb://junsong-gen
              predicates:
                - Path=/gen/**
              filters:
                - StripPrefix=1
            - id: junsong-job
              uri: lb://junsong-job
              predicates:
                - Path=/job/**
              filters:
                - StripPrefix=1
            - id: junsong-system-userdept
              uri: lb://junsong-system
              predicates:
                - Path=/userDept/**
            - id: junsong-system
              uri: lb://junsong-system
              predicates:
                - Path=/system/**
              filters:
                - StripPrefix=1
            - id: junsong-file
              uri: lb://junsong-file
              predicates:
                - Path=/file/**
              filters:
                - StripPrefix=1
            - id: junsong-finance
              uri: lb://junsong-finance
              predicates:
                - Path=/finance/**
              filters:
                - StripPrefix=1
            - id: junsong-member
              uri: lb://junsong-member
              predicates:
                - Path=/member/**
              filters:
                - StripPrefix=1
            - id: junsong-workflow
              uri: lb://junsong-workflow
              predicates:
                - Path=/workflow/**
              filters:
                - StripPrefix=1
            - id: junsong-open
              uri: lb://junsong-open
              predicates:
                - Path=/open/**
              filters:
                - StripPrefix=1
            - id: junsong-openapi-v1
              uri: lb://junsong-open
              predicates:
                - Path=/openapi/v1/**
              filters:
                - StripPrefix=2
            - id: junsong-openapi-v2
              uri: lb://junsong-open
              predicates:
                - Path=/openapi/v2/**
              filters:
                - StripPrefix=2
            - id: junsong-openapi-latest
              uri: lb://junsong-open
              predicates:
                - Path=/openapi/latest/**
              filters:
                - StripPrefix=2
            - id: junsong-system-ws
              uri: lb://junsong-system
              predicates:
                - Path=/system/ws/**
              filters:
                - StripPrefix=1
  config:
    import:
      - optional:nacos:application-${SPRING_PROFILES_ACTIVE:dev}.yml
      - optional:nacos:redis-${SPRING_PROFILES_ACTIVE:dev}.yml
      - optional:nacos:junsong-gateway-${SPRING_PROFILES_ACTIVE:dev}.yml

security:
  captcha:
    enabled: false
    type: math
  xss:
    enabled: true
    excludeUrls:
      - /system/notice
  ignore:
    whites:
      - /auth/logout
      - /auth/login
      - /auth/mp/login
      - /auth/mp/wechat/login
      - /auth/mp/wechat/bind
      - /auth/register
      - /member/mp/capabilities
      - /code
      - /system/user/deptsForLogin
      - /*/v2/api-docs
      - /*/v3/api-docs
      - /member/v2/api-docs
      - /member/v3/api-docs
      - /member/swagger-ui.html
      - /member/swagger-ui/**
      - /member/doc.html
      - /workflow/health/**
      - /open/v3/api-docs
      - /open/swagger-ui/**
      - /openapi/v1/**/**
      - /openapi/v2/**/**
      - /openapi/latest/**/**
      - /system/ws/**/**
      - /csrf

sentinel:
  eager: true
  transport:
    dashboard: junsong-sentinel-dashboard:8718

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    enabled: true
    urls:
      - name: 认证服务
        url: /auth/v3/api-docs
      - name: 系统模块
        url: /system/v3/api-docs
      - name: 财务模块
        url: /finance/v3/api-docs
      - name: 会员模块
        url: /member/v3/api-docs
      - name: 工作流模块
        url: /workflow/v3/api-docs
      - name: 文件服务
        url: /file/v3/api-docs
      - name: 定时任务
        url: /job/v3/api-docs
      - name: 代码生成
        url: /gen/v3/api-docs
