  <!-- 图例：4 种连线语义 -->
  <rect x="30" y="1240" width="1140" height="90" rx="10" fill="#ffffff" stroke="none" stroke-width="2"/><text x="600" y="1253.12" text-anchor="middle" fill="#111827" font-size="12.5px" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><tspan x="600" dy="0">📖 连线语义说明（为保证布局稳定仅保留 5 条垂直线，其余关系改为文字说明）：</tspan><tspan x="600" dy="18.125">· → HTTPS / HTTP REST 实线 主请求流量：双端 → 网关 → 认证 → 服务集群 → 存储 → DevOps 采集；</tspan><tspan x="600" dy="18.125">· 服务间声明式调用：使用 OpenFeign + LoadBalancer（未画连线，段4说明条已标注）；</tspan><tspan x="600" dy="18.125">· 服务注册发现：9 个微服务 + 认证 → Nacos V3 grpc 长连接注册心跳；</tspan><tspan x="600" dy="18.125">· 质量/安全门禁：Playwright E2E 对双端回归；契约测试 + k6 压测 + 安全脱敏 对服务集群门禁。</tspan></text>
