server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://junsong-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: junsong-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["junsong-"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: container_name
        regex: '/(.*)'
        replacement: '${1}'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: log_stream
      - target_label: job
        replacement: junsong-services
