server:
  port: 9201

spring:
  application:
    name: junsong-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  rabbitmq:
    host: ${RABBITMQ_HOST:junsong-rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 5
  cloud:
    nacos:
      discovery:
        server-addr: junsong-nacos:8848
        username: nacos
        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: junsong-nacos:8848
        username: nacos
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yml
  config:
    import:
      - optional:nacos:application-${SPRING_PROFILES_ACTIVE:dev}.yml
      - optional:nacos:redis-${SPRING_PROFILES_ACTIVE:dev}.yml
      - optional:nacos:datasource-druid-${SPRING_PROFILES_ACTIVE:dev}.yml
      - optional:nacos:junsong-system-${SPRING_PROFILES_ACTIVE:dev}.yml
