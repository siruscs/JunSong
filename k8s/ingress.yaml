apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: junsong-ingress
  namespace: junsong
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: api.junsong.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: junsong-gateway
                port:
                  number: 8080
    - host: www.junsong.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: junsong-nginx
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: junsong-openapi-ingress
  namespace: junsong
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: openapi.junsong.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: junsong-gateway
                port:
                  number: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: junsong-nginx
  namespace: junsong
spec:
  selector:
    app: junsong-nginx
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: junsong-nginx
  namespace: junsong
spec:
  replicas: 2
  selector:
    matchLabels:
      app: junsong-nginx
  template:
    metadata:
      labels:
        app: junsong-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits:   { memory: "128Mi", cpu: "100m" }
