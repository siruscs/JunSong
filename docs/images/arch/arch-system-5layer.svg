<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1180" width="1200" height="1180">
  <defs>
    <style>
      .title { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 22px; font-weight: 700; fill: #1e293b; }
      .layer-title { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 16px; font-weight: 700; fill: #ffffff; }
      .layer-desc { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12px; fill: #475569; }
      .card-title { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 600; fill: #1e293b; }
      .card-sub { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 11px; fill: #64748b; }
      .legend-text { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12px; fill: #475569; }
    </style>
    <marker id="arrDown" markerWidth="10" markerHeight="10" refX="5" refY="2" orient="auto">
      <path d="M0,0 L5,8 L10,0 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="1180" fill="#ffffff"/>

  <text x="600" y="38" text-anchor="middle" class="title">军颂云 · 五层系统架构图</text>

  <!-- ============ Layer 1: 用户接入层 (pink) ============ -->
  <rect x="60" y="68" width="1080" height="160" rx="12" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <rect x="60" y="68" width="1080" height="42" rx="12" fill="#ec4899"/>
  <rect x="60" y="98" width="1080" height="12" fill="#ec4899"/>
  <text x="90" y="96" class="layer-title">① 用户接入层</text>
  <text x="300" y="96" class="layer-desc" fill="#fce7f3">多端接入 · 统一门户</text>

  <rect x="130" y="125" width="230" height="85" rx="10" fill="#ffffff" stroke="#fbcfe8" stroke-width="1.5"/>
  <text x="245" y="155" text-anchor="middle" class="card-title">PC 管理后台</text>
  <text x="245" y="177" text-anchor="middle" class="card-sub">Vue 3 + Element Plus</text>
  <text x="245" y="197" text-anchor="middle" class="card-sub">TypeScript · Vite</text>

  <rect x="485" y="125" width="230" height="85" rx="10" fill="#ffffff" stroke="#fbcfe8" stroke-width="1.5"/>
  <text x="600" y="155" text-anchor="middle" class="card-title">移动端小程序</text>
  <text x="600" y="177" text-anchor="middle" class="card-sub">uni-app · Vue 3</text>
  <text x="600" y="197" text-anchor="middle" class="card-sub">微信 / 支付宝</text>

  <rect x="840" y="125" width="230" height="85" rx="10" fill="#ffffff" stroke="#fbcfe8" stroke-width="1.5"/>
  <text x="955" y="155" text-anchor="middle" class="card-title">第三方对接</text>
  <text x="955" y="177" text-anchor="middle" class="card-sub">开放 API · H5</text>
  <text x="955" y="197" text-anchor="middle" class="card-sub">回调通知机制</text>

  <line x1="600" y1="228" x2="600" y2="252" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrDown)"/>

  <!-- ============ Layer 2: 接入网关层 (blue) ============ -->
  <rect x="60" y="255" width="1080" height="140" rx="12" fill="#eff6ff" stroke="#0284c7" stroke-width="2"/>
  <rect x="60" y="255" width="1080" height="42" rx="12" fill="#0284c7"/>
  <rect x="60" y="285" width="1080" height="12" fill="#0284c7"/>
  <text x="90" y="283" class="layer-title">② 接入网关层</text>
  <text x="300" y="283" class="layer-desc" fill="#dbeafe">统一入口 · 安全过滤 · 流量治理</text>

  <rect x="120" y="310" width="240" height="75" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="240" y="338" text-anchor="middle" class="card-title">Spring Cloud Gateway</text>
  <text x="240" y="360" text-anchor="middle" class="card-sub">路由 · 转发 · 鉴权</text>

  <rect x="480" y="310" width="240" height="75" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="600" y="338" text-anchor="middle" class="card-title">Sentinel 流控</text>
  <text x="600" y="360" text-anchor="middle" class="card-sub">熔断 · 降级 · 限流</text>

  <rect x="840" y="310" width="240" height="75" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="960" y="338" text-anchor="middle" class="card-title">SSL / WAF</text>
  <text x="960" y="360" text-anchor="middle" class="card-sub">HTTPS · 防火墙</text>

  <line x1="600" y1="396" x2="600" y2="420" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrDown)"/>

  <!-- ============ Layer 3: 业务服务层 (green) - 9 services ============ -->
  <rect x="60" y="425" width="1080" height="200" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <rect x="60" y="425" width="1080" height="42" rx="12" fill="#059669"/>
  <rect x="60" y="455" width="1080" height="12" fill="#059669"/>
  <text x="90" y="453" class="layer-title">③ 业务服务层 · 九大微服务</text>
  <text x="380" y="453" class="layer-desc" fill="#d1fae5">领域驱动 · Spring Boot 微服务集群</text>

  <!-- Row 1 of services -->
  <rect x="80" y="475" width="145" height="52" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="152" y="507" text-anchor="middle" class="card-title" font-size="12">系统服务</text>

  <rect x="238" y="475" width="145" height="52" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="310" y="507" text-anchor="middle" class="card-title" font-size="12">认证服务</text>

  <rect x="396" y="475" width="145" height="52" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="468" y="507" text-anchor="middle" class="card-title" font-size="12">会员服务</text>

  <rect x="554" y="475" width="145" height="52" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="626" y="507" text-anchor="middle" class="card-title" font-size="12" fill="#92400e">财务服务 ⭐</text>

  <rect x="712" y="475" width="145" height="52" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="784" y="507" text-anchor="middle" class="card-title" font-size="12">工作流服务</text>

  <rect x="870" y="475" width="145" height="52" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="942" y="507" text-anchor="middle" class="card-title" font-size="12">开放平台</text>

  <!-- Row 2 -->
  <rect x="158" y="538" width="145" height="52" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="230" y="570" text-anchor="middle" class="card-title" font-size="12">代码生成</text>

  <rect x="428" y="538" width="145" height="52" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="500" y="570" text-anchor="middle" class="card-title" font-size="12">定时任务</text>

  <rect x="698" y="538" width="145" height="52" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="770" y="570" text-anchor="middle" class="card-title" font-size="12">文件服务</text>

  <line x1="600" y1="626" x2="600" y2="650" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrDown)"/>

  <!-- ============ Layer 4: 数据资源层 (amber) ============ -->
  <rect x="60" y="655" width="1080" height="170" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <rect x="60" y="655" width="1080" height="42" rx="12" fill="#f59e0b"/>
  <rect x="60" y="685" width="1080" height="12" fill="#f59e0b"/>
