  <text x="600" y="567" text-anchor="middle" class="card-sub">角色 · 菜单 · 按钮</text>
  <text x="600" y="587" text-anchor="middle" class="card-sub">数据权限隔离</text>

  <rect x="780" y="515" width="260" height="90" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
