  <text x="240" y="182" text-anchor="middle" class="card-sub">Vue 3 + Vite</text>
  <text x="240" y="202" text-anchor="middle" class="card-sub">TypeScript · Pinia</text>

  <rect x="470" y="130" width="220" height="90" rx="10" fill="#ffffff" stroke="#fbcfe8" stroke-width="1.5"/>
  <text x="580" y="160" text-anchor="middle" class="card-title">移动端</text>
  <text x="580" y="182" text-anchor="middle" class="card-sub">uni-app · Vue 3</text>
  <text x="580" y="202" text-anchor="middle" class="card-sub">微信/支付宝小程序</text>

  <rect x="810" y="130" width="220" height="90" rx="10" fill="#ffffff" stroke="#fbcfe8" stroke-width="1.5"/>
  <text x="920" y="160" text-anchor="middle" class="card-title">API 文档</text>
  <text x="920" y="182" text-anchor="middle" class="card-sub">Swagger / Knife4j</text>
  <text x="920" y="202" text-anchor="middle" class="card-sub">在线调试接口</text>

  <!-- Arrow 1→2 -->
  <line x1="600" y1="240" x2="600" y2="265" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowDown)"/>

