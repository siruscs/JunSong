  <text x="310" y="683" class="layer-desc" fill="#fde68a">关系型数据库 · 缓存 · 对象存储 · 搜索引擎</text>

  <rect x="100" y="710" width="200" height="95" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
  <text x="200" y="742" text-anchor="middle" class="card-title">MySQL 8.0</text>
  <text x="200" y="764" text-anchor="middle" class="card-sub">主从复制 · 读写分离</text>
  <text x="200" y="784" text-anchor="middle" class="card-sub">业务数据持久化</text>

  <rect x="330" y="710" width="200" height="95" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
  <text x="430" y="742" text-anchor="middle" class="card-title">Redis 7.x</text>
  <text x="430" y="764" text-anchor="middle" class="card-sub">缓存 · Session · 分布式锁</text>
  <text x="430" y="784" text-anchor="middle" class="card-sub">Redisson 客户端</text>

  <rect x="560" y="710" width="200" height="95" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
  <text x="660" y="742" text-anchor="middle" class="card-title">MinIO</text>
  <text x="660" y="764" text-anchor="middle" class="card-sub">分布式对象存储</text>
  <text x="660" y="784" text-anchor="middle" class="card-sub">文件 · 图片 · 附件</text>

  <rect x="790" y="710" width="200" height="95" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
  <text x="890" y="742" text-anchor="middle" class="card-title">Nacos</text>
  <text x="890" y="764" text-anchor="middle" class="card-sub">配置中心 · 注册发现</text>
  <text x="890" y="784" text-anchor="middle" class="card-sub">动态配置管理</text>

  <line x1="600" y1="826" x2="600" y2="850" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrDown)"/>

  <!-- ============ Layer 5: 基础设施层 (teal/gray) ============ -->
  <rect x="60" y="855" width="1080" height="170" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <rect x="60" y="855" width="1080" height="42" rx="12" fill="#0d9488"/>
  <rect x="60" y="885" width="1080" height="12" fill="#0d9488"/>
